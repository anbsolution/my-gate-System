plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mygate.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mygate.android'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

